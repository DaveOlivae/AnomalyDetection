[tool.poetry]

name = "anomaly-detection"
version = "0.1.0"
description = "Projeto de detecção de anomalias"
authors = ["Davi"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"

numpy = "^1.26"
pandas = "<2.2"
scikit-learn = "^1.4"
xgboost = "^3.0"
lightgbm = "^4.6"

pycaret = "^3.3"

matplotlib = "<3.8"
seaborn = "^0.13"

jupyter = "^1.0"
ipykernel = "^6.29"
mlflow = "^3.12.0"
optuna = "^4.9.0"

[tool.poetry.scripts]
tep-process = "src.cli.process_tep:main"
tep-build-windows = "src.cli.build_windows:main"
tep-train-timeseries = "src.cli.train_timeseries:main"
tep-evaluate = "src.cli.evaluate:main"
